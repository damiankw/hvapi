name: ci

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Formatting
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: Vet (host and Windows targets)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test
        run: go test ./...

      - name: Build development exe
        run: |
          VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/damiankw/hvapi/internal/version.Version=${VERSION} \
              -X github.com/damiankw/hvapi/internal/version.Commit=${GITHUB_SHA::7} \
              -X github.com/damiankw/hvapi/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/hvapi.exe ./cmd/hvapi
          cp config.example.json dist/
          go run -ldflags "-X github.com/damiankw/hvapi/internal/version.Version=${VERSION}" \
            ./cmd/hvapi openapi -o dist/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: hvapi-dev-${{ github.sha }}
          path: dist/
