name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Creates go.sum if it is not committed yet.
      - name: Resolve modules
        run: go mod tidy

      - name: Vet (Windows target)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test
        run: go test ./...

      - name: Build hvapi.exe
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/damiankw/hvapi/internal/version.Version=${VERSION} \
              -X github.com/damiankw/hvapi/internal/version.Commit=${GITHUB_SHA::7} \
              -X github.com/damiankw/hvapi/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/hvapi.exe ./cmd/hvapi
          cp config.example.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: hvapi-windows-amd64
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hvapi.exe
            dist/config.example.json
